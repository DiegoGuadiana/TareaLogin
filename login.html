<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <div id="header-slot"></div>

    <main>
      <div class="login-box">
        <h2>Iniciar sesión</h2>
        <p class="text">Accede con tu cuenta</p>

        <form id="login-form">
          <input id="login-email" type="email" placeholder="Correo electrónico" required>
          <input id="login-pass" type="password" placeholder="Contraseña" required>
          <button type="submit">Entrar</button>
        </form>

        <p class="small-text">¿Olvidaste tu contraseña?</p>
        <p class="small-text">
          ¿No tienes cuenta? <a href="register.html">Regístrate</a>
        </p>
      </div>
    </main>

    <div id="footer-slot"></div>

  </div>

  <script src="app.js"></script>
  <script src="layout.js"></script>
  <script>
    initLayout();
    document.getElementById("login-form").addEventListener("submit", handleLogin);
  </script>
</body>
</html>
