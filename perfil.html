<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <div id="header-slot"></div>

    <main>
      <div class="page-box">
        <h2>Perfil</h2>
        <p class="text">Página interior</p>

        <div class="cards">
          <div class="mini-card">
            <h3>Nombre</h3>
            <p id="perfil-nombre">Ejemplo</p>
          </div>
          <div class="mini-card">
            <h3>Correo</h3>
            <p id="perfil-correo">ejemplo@correo.com</p>
          </div>
        </div>

        <a href="home.html" class="logout">Volver al Home</a>
      </div>
    </main>

    <div id="footer-slot"></div>

  </div>

  <script src="app.js"></script>
  <script src="layout.js"></script>
  <script>
    requireAuth();
    initLayout();

    const s = getSession();
    if (s) {
      document.getElementById("perfil-nombre").textContent = s.name;
      document.getElementById("perfil-correo").textContent = s.email;
    }
  </script>
</body>
</html>
