<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <header class="site-header">
      <div class="header-inner">
        <div class="brand">Tarea2</div>
        <nav class="nav">
          <a href="home.html">Home</a>
          <a href="perfil.html">Perfil</a>
          <a href="configuracion.html">Configuración</a>
          <a href="ayuda.html">Ayuda</a>
          
          <a href="login.html">Salir</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="home-box">
        <h2>Panel principal</h2>

        
        <p class="text">Bienvenido, <strong id="user-name">Usuario</strong></p>

        <div class="cards">
          <div class="mini-card">
            <h3>Estado</h3>
            <p>Cuenta activa</p>
          </div>

          <div class="mini-card">
            <h3>Acceso</h3>
            <p>Última conexión hoy</p>
          </div>

          <div class="mini-card">
            <h3>Opciones</h3>
            <p>Explora el sistema</p>
          </div>
        </div>

        <div class="link-list">
          <a href="perfil.html">Ir a Perfil</a>
          <a href="configuracion.html">Ir a Configuración</a>
          <a href="ayuda.html">Ir a Ayuda</a>
        </div>

        
        <a href="#" class="logout" id="logout-btn">Cerrar sesión</a>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 Tarea2</p>
        <p>Versión: 0.1</p>
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
  <script>
    requireAuth(); 
    paintUser("#user-name");
    document.getElementById("logout-btn").addEventListener("click", handleLogout);
  </script>
</body>
</html>
