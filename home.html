<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <div id="header-slot"></div>

    <main>
      <div class="home-box">
        <h2>Panel principal</h2>
        <p class="text">Bienvenido, <strong id="user-name">Usuario</strong></p>

        <div class="cards">
          <div class="mini-card">
            <h3>Estado</h3>
            <p>Cuenta activa</p>
          </div>

          <div class="mini-card">
            <h3>Acceso</h3>
            <p>Última conexión hoy</p>
          </div>

          <div class="mini-card">
            <h3>Opciones</h3>
            <p>Explora el sistema</p>
          </div>
        </div>

        <div class="link-list">
          <a href="perfil.html">Ir a Perfil</a>
          <a href="configuracion.html">Ir a Configuración</a>
          <a href="ayuda.html">Ir a Ayuda</a>
        </div>

        <a href="#" class="logout" id="logout-btn">Cerrar sesión</a>
      </div>
    </main>

    <div id="footer-slot"></div>

  </div>

  <script src="app.js"></script>
  <script src="layout.js"></script>
  <script>
    requireAuth();          
    initLayout();           
    paintUser("#user-name");
    document.getElementById("logout-btn").addEventListener("click", handleLogout);
  </script>
</body>
</html>
